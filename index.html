<style>
  html, body {
    height: 100%;

    height: 22px;

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  const canvas = document.querySelector('canvas.dither');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
  renderer.setPixelRatio(1);
  renderer.setSize(110, 110, false);
  renderer.setClearColor(0xffffff, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
  camera.position.z = 2;

  // Bayer 4x4 ordered-dither matrix → packed as a 4x4 single-channel texture
  const m = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
  const bayerData = new Uint8Array(m.map(v => Math.round((v / 16) * 255)));
  const bayerTex = new THREE.DataTexture(bayerData, 4, 4, THREE.RedFormat, THREE.UnsignedByteType);
  bayerTex.wrapS = bayerTex.wrapT = THREE.RepeatWrapping;
  bayerTex.magFilter = THREE.NearestFilter;
  bayerTex.minFilter = THREE.NearestFilter;
  bayerTex.needsUpdate = true;

  const material = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3,
    uniforms: {
      uLightDir: { value: new THREE.Vector3(0.55, 0.55, 0.7).normalize() },
      uBayer:    { value: bayerTex }
    },
    vertexShader: `
      out vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      precision highp float;
      in vec3 vNormal;
      out vec4 outColor;
      uniform vec3 uLightDir;
      uniform sampler2D uBayer;

      void main() {
        vec3 n = normalize(vNormal);
        vec3 l = normalize(uLightDir);
        float d = max(0.0, dot(n, l));
        // Lambert + soft specular highlight
        float intensity = 0.03 + 0.90 * d + pow(d, 18.0) * 0.55;
        intensity = clamp(intensity, 0.0, 1.0);

        ivec2 px = ivec2(mod(gl_FragCoord.xy, 4.0));
        float t = texelFetch(uBayer, px, 0).r;
        float v = intensity > t ? 1.0 : 0.0;
        outColor = vec4(vec3(v), 1.0);
      }
    `
  });

  const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.95, 64, 64), material);
  scene.add(sphere);

  // Smoothed light direction follows cursor
  const target  = new THREE.Vector3(0.55, 0.55, 0.7).normalize();
  const current = target.clone();

  function updateTarget(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;
    // offsets in units of half-canvas (cursor over centre → 0,0)
    const dx =  (clientX - cx) / (rect.width  / 2);
    const dy = -(clientY - cy) / (rect.height / 2);
    // z keeps the light in front so dot(n,l) stays meaningful even far away
    target.set(dx, dy, 0.7).normalize();
  }

  window.addEventListener('mousemove', (e) => updateTarget(e.clientX, e.clientY), { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (e.touches[0]) updateTarget(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  function loop() {
    current.lerp(target, 0.20).normalize();
    material.uniforms.uLightDir.value.copy(current);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>

</body>
